name: mhesham

services:
  web:
    build: .
    image: mhesham-web:local
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - media_data:/app/media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 8000), 3); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      default:
      proxy_network:
        aliases:
          - mhesham-web

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default

volumes:
  media_data:
  postgres_data:

networks:
  default:
    internal: true
  proxy_network:
    name: ${PROXY_NETWORK_NAME:-proxy_network}
    external: true
